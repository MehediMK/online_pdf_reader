<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FlipPDF - Modern PDF Reader</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/style.css">
  <script src="./src/js/jquery-3.6.0.min.js"></script>
  <script src="./src/js/turn.min.js"></script>
  <script src="./src/js/pdf.min.js"></script>
</head>
<body>
  <!-- App Bar -->
  <header class="app-bar" id="appBar">
    <div class="app-bar-inner">
      <div class="app-bar-left">
        <button id="sidebarToggle" class="icon-btn" title="Toggle Sidebar" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="app-brand">FlipPDF</span>
      </div>
      <div class="app-bar-center">
        <div class="page-nav">
          <button id="firstPageBtn" class="icon-btn" title="First Page" aria-label="First page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
          </button>
          <button id="prevBtn" class="icon-btn" title="Previous Page" aria-label="Previous page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="page-input-group">
            <input type="number" id="pageNumberInput" min="1" placeholder="1" aria-label="Page number" />
            <span id="totalPages" class="page-total" aria-live="polite"></span>
          </div>
          <button id="nextBtn" class="icon-btn" title="Next Page" aria-label="Next page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button id="lastPageBtn" class="icon-btn" title="Last Page" aria-label="Last page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
          </button>
        </div>
      </div>
      <div class="app-bar-right">
        <button id="gotoBtn" class="icon-btn" title="Go to Page (Ctrl+G)" aria-label="Go to page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button id="nightModeBtn" class="icon-btn" title="Toggle Night Mode" aria-label="Toggle night mode">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="presentationBtn" class="icon-btn" title="Presentation Mode" aria-label="Enter presentation mode">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </button>
      </div>
    </div>
    <div id="progressBar" class="progress-bar" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progressFill" class="progress-fill" style="width: 0%" aria-hidden="true"></div>
    </div>
  </header>

  <!-- Toolbar -->
  <nav id="toolbar" class="toolbar" aria-label="PDF controls">
    <div class="toolbar-group">
      <label for="fileInput" class="visually-hidden">Select PDF file</label>
      <input type="file" id="fileInput" accept="application/pdf" aria-label="Select PDF file">
      <button id="loadBtn" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Open
      </button>
      <button id="downloadBtn" class="icon-btn" title="Download PDF" aria-label="Download PDF">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
    <div class="toolbar-divider" aria-hidden="true"></div>
    <div class="toolbar-group">
      <button id="zoomOutBtn" class="icon-btn" title="Zoom Out" aria-label="Zoom out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <span id="zoomLevel" class="zoom-badge">100%</span>
      <button id="zoomInBtn" class="icon-btn" title="Zoom In" aria-label="Zoom in">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <button id="fitWidthBtn" class="icon-btn" title="Fit Width" aria-label="Fit width">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><polyline points="4 17 4 20 20 20 20 17"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
      </button>
      <button id="fitPageBtn" class="icon-btn" title="Fit Page" aria-label="Fit page">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
    <div class="toolbar-divider" aria-hidden="true"></div>
    <div class="toolbar-group">
      <button id="toggleViewBtn" class="icon-btn" title="Toggle Single/Double Page" aria-label="Toggle view mode">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="8" y1="7" x2="8" y2="13"/></svg>
      </button>
      <button id="toggleSoundBtn" class="icon-btn" title="Toggle Sound" aria-label="Toggle page turn sound">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <button id="printBtn" class="icon-btn" title="Print PDF" aria-label="Print document">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      </button>
      <button id="immersiveBtn" class="icon-btn" title="Toggle Immersive Mode" aria-label="Toggle immersive reading mode">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
    <div class="toolbar-divider" aria-hidden="true"></div>
    <div class="toolbar-group annotation-group">
      <button id="annotateBtn" class="icon-btn" title="Toggle Annotation Mode" aria-label="Toggle annotation mode">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
      <button id="toolFreehand" class="icon-btn" title="Freehand Draw" aria-label="Freehand drawing">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      </button>
      <button id="toolHighlight" class="icon-btn" title="Highlight" aria-label="Highlight text">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14l-7 7m0 0l-4-4m4 4l6-6m-7 7h7"/><path d="M12 4L9.5 6.5 12 9l-2.5 2.5L12 14l-2.5 2.5"/></svg>
      </button>
      <label for="colorPicker" class="visually-hidden">Annotation color</label>
      <input type="color" id="colorPicker" value="#6366f1" title="Annotation Color" aria-label="Annotation color">
      <button id="saveAnnotations" class="icon-btn" title="Save Annotations" aria-label="Save annotations">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      </button>
      <button id="loadAnnotations" class="icon-btn" title="Load Annotations" aria-label="Load annotations">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </button>
    </div>
    <div class="toolbar-divider" aria-hidden="true"></div>
    <div class="toolbar-group search-group">
      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search..." aria-label="Search PDF">
        <button id="searchPrevBtn" class="icon-btn search-nav-btn" title="Previous result" aria-label="Previous search result">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button id="searchNextBtn" class="icon-btn search-nav-btn" title="Next result" aria-label="Next search result">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <span id="searchCount" class="search-count"></span>
      </div>
    </div>
    <div class="toolbar-spacer"></div>
    <span id="status" class="status-badge" aria-live="polite">No file selected</span>
  </nav>

  <!-- Main Layout -->
  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Document navigation">
      <div class="sidebar-section">
        <div class="sidebar-header">
          <h3>Pages</h3>
          <span id="readBadge" class="read-badge" style="display:none" aria-live="polite"></span>
        </div>
        <div id="resumePrompt" class="resume-prompt" style="display:none">
          <button id="resumeBtn" class="btn btn-primary btn-sm resume-btn" aria-label="Resume reading">Resume reading</button>
        </div>
        <div id="thumbnailContainer" class="thumbnails" aria-label="Page thumbnails"></div>
      </div>
      <div class="sidebar-section">
        <h3>Bookmarks</h3>
        <div id="bookmarkContainer" class="bookmark-list">
          <p class="sidebar-empty">No bookmarks yet</p>
        </div>
      </div>
      <div class="sidebar-section">
        <h3>Contents</h3>
        <ul id="outlineContainer" class="outline" aria-label="Document outline"></ul>
      </div>
      <div class="sidebar-section">
        <h3>Recent Files</h3>
        <div id="recentContainer" class="recent-list">
          <p class="sidebar-empty">No recent files</p>
        </div>
      </div>
    </aside>

    <main class="viewer" tabindex="0" aria-label="PDF viewer">
      <div id="flipbook" class="flipbook" aria-roledescription="page"></div>
      <div id="emptyState" class="empty-state" role="img" aria-label="No document loaded">
        <div class="empty-icon" aria-hidden="true">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <h2 class="empty-title">Drop your PDF here</h2>
        <p class="empty-desc">or click to browse files</p>
        <button id="emptyLoadBtn" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Browse Files
        </button>
      </div>
    </main>
  </div>

  <audio id="flipSound" src="./src/static/paper_slider.mp3" preload="auto"></audio>

  <!-- Go to Page Modal -->
  <div id="gotoModal" class="modal-overlay hidden">
    <div class="modal-dialog">
      <h3 class="modal-title">Go to Page</h3>
      <div class="modal-body">
        <input type="number" id="gotoInput" class="modal-input" min="1" placeholder="Page number" autofocus>
        <div class="modal-actions">
          <button id="gotoCancelBtn" class="btn">Cancel</button>
          <button id="gotoConfirmBtn" class="btn btn-primary">Go</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Presentation Overlay -->
  <div id="presentationOverlay" class="presentation-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="presentationTitle">
    <div id="presentationPage" class="presentation-page-info"></div>
    <div class="presentation-bar">
      <button id="presentationPrev" class="icon-btn" aria-label="Previous slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span id="presentationProgress" class="presentation-progress">Page 1 of 1</span>
      <button id="presentationNext" class="icon-btn" aria-label="Next slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button id="presentationExit" class="icon-btn presentation-exit" aria-label="Exit presentation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <footer class="app-footer">
    <p>Built with <span class="heart">&hearts;</span> using <strong>PDF.js</strong> &amp; <strong>Turn.js</strong></p>
  </footer>

  <script src="./src/js/main.js"></script>
</body>
</html>
